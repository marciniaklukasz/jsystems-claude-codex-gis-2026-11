# Progi i wersja pytań (ADR-000 §3, ADR-001 §3.4, ADR-002 §4). Zmiana przed końcową próbą = osobny commit (AC-20a, AC-23).

[links]
max_distance_m = 15.0          # AC-06: dystans > 15 m -> ambiguous_link
max_bearing_diff_deg = 30.0    # AC-06: różnica kierunku > 30° -> ambiguous_link
distance_tolerance_m = 1.0     # ADR-001 §3.4 krok 1: link_distance_mismatch
bearing_tolerance_deg = 1.0    # ADR-001 §3.4 krok 2: link_bearing_mismatch
tangent_half_length_m = 5.0    # sources.json links.bearing: styczna ±5 m
junction_radius_m = 25.0       # ADR-001 §4.4

[compare]
missing_classes = [
  "motorway", "motorway_link", "trunk", "trunk_link", "primary", "primary_link",
  "secondary", "secondary_link", "tertiary", "tertiary_link",
]

[surface]
version = 1
osm_paved = [
  "asphalt", "concrete", "concrete:plates", "concrete:lanes", "paved", "paving_stones", "sett",
  "cobblestone", "unhewn_cobblestone", "chipseal", "metal", "wood",
]
osm_unpaved = [
  "unpaved", "gravel", "fine_gravel", "compacted", "dirt", "earth", "ground", "grass", "mud",
  "sand", "pebblestone", "rock", "woodchips", "grass_paver",
]
overture_paved = ["paved", "paving_stones", "metal"]
overture_unpaved = ["unpaved", "gravel", "dirt"]

[vision]
questions_version = 1
decision_model = "typesafe/jev-1.14"
comparison_model = "openai/gpt-6-luna-decisions"
fallback_model = "openai/gpt-6-luna"
fallback_reasoning_effort = "medium"
fallback_max_tokens = 1024
abstain_threshold = 0.7        # AC-20a, wartość startowa
reserve_usd = 0.01             # ADR-002 §4.8
timeout_s = 40                 # ADR-002 D-202
max_side_px = 1568             # ADR-002 §4.6
min_side_px = 256
state_text = "Street-level photograph. Answer about what is visible."

[evaluation]
# Progi akceptacji odczytu (AC-23), zapisane przed końcową próbą.
min_coverage = 0.3
min_accuracy = 0.8
