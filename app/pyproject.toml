[project]
name = "map-qa"
version = "0.1.0"
description = "Kontrola mapy: drogi OSM i Overture a zdjęcia ulic Krakowa (PoC)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas==1.2.0",
    "jinja2==3.1.6",
    "openrouter==1.3.107",
    "pandas==3.1.1",
    "pillow==12.0.0",
    "pyarrow==23.0.1",
    "pyproj==3.8.0",
    "shapely==2.2.0",
    "streamlit==1.66.1",
]

[project.scripts]
map-qa = "map_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/map_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: wywołuje prawdziwe API OpenRouter (płatne, wymaga OPENROUTER_API_KEY)",
]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
